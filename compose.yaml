services:
  command-center:
    build:
      context: .
      args:
        APP_VERSION: 3.4.2
    image: zeaz-ai-command-center:3.4.2
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PANEL_TOKEN: ${PANEL_TOKEN:?Set PANEL_TOKEN in your shell or .env}
      PANEL_ALLOWED_HOSTS: localhost,127.0.0.1
      PANEL_ALLOWED_ROOTS: /workspace
      PANEL_DATABASE_PATH: /data/jobs.sqlite3
      PANEL_MAX_CONCURRENT_JOBS: 2
    volumes:
      - command-center-data:/data
      - ./workspace:/workspace
    tmpfs:
      - /tmp:size=64m,mode=1777

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your shell or .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/zeaz-ai-command-center.json:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  command-center-data:
  prometheus-data:
  grafana-data:
