openapi: 3.1.0
info:
  title: ZEAZ AI Command Center API
  version: 3.5.0
  description: |
    Provider discovery, generated CLI schemas, durable jobs, streamed process output,
    workflows, analytics, notifications, webhooks, API keys, audit logging, and
    a Windows 11 Fluent Design desktop GUI.
servers:
  - url: http://127.0.0.1:8765
security:
  - bearerAuth: []

paths:
  # ── Operational ──────────────────────────────────────────
  /healthz:
    get:
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /readyz:
    get:
      security: []
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready
  /api/version:
    get:
      summary: API and application version
      responses:
        "200":
          description: Version metadata

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
