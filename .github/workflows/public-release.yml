name: Public Profile Release

on:
  push:
    branches: [main]
    paths:
      - "deploy/public/**"
      - ".github/workflows/public-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-profile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build public release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build and validation toolchain
        run: python -m pip install --upgrade pip build pytest ruff
      - name: Validate release source
        run: make validate
      - name: Build wheel and source distribution
        run: python -m build
      - name: Build standalone public source archive
        run: |
          set -euo pipefail
          version="$(python3 -c 'from version import __version__; print(__version__)')"
          profile_version="${version}-global-public.${GITHUB_RUN_NUMBER}"
          prefix="zeaz-ai-command-center-${profile_version}/"
          git archive \
            --format=tar.gz \
            --prefix="$prefix" \
            --output="dist/zeaz-ai-command-center-${profile_version}.tar.gz" \
            "$GITHUB_SHA"
          git archive \
            --format=zip \
            --prefix="$prefix" \
            --output="dist/zeaz-ai-command-center-${profile_version}.zip" \
            "$GITHUB_SHA"
          printf '%s\n' "$profile_version" > dist/PUBLIC_PROFILE_VERSION
          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )
          echo "PROFILE_VERSION=$profile_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$profile_version" >> "$GITHUB_ENV"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: zeaz-${{ env.PROFILE_VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              --target "$GITHUB_SHA" \
              --title "ZEAZ ${PROFILE_VERSION}" \
              --notes-file deploy/public/RELEASE-NOTES.md \
              --prerelease
          fi
