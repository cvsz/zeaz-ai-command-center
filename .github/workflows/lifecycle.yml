name: Release Lifecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-shutdown-persistence:
    name: Apply durable shutdown fix
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/lifecycle-validation-v3.4.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Track and join job workers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server.py")
          text = path.read_text()

          old = "        self.shutting_down = threading.Event()\n        self._event_bus: list[dict[str, Any]] = []"
          new = "        self.shutting_down = threading.Event()\n        self.worker_threads: set[threading.Thread] = set()\n        self._event_bus: list[dict[str, Any]] = []"
          if old not in text and new not in text:
              raise SystemExit("JobManager worker set insertion point not found")
          text = text.replace(old, new, 1)

          old = '        threading.Thread(target=self._run, args=(job,), daemon=True, name=f"job-{job.id}").start()'
          new = '        self._start_worker(job, name=f"job-{job.id}")'
          if old not in text and new not in text:
              raise SystemExit("JobManager create worker call not found")
          text = text.replace(old, new, 1)

          marker = "        self.store.upsert(record, output, output_base)\n\n    @staticmethod\n    def _read_output"
          replacement = '''        self.store.upsert(record, output, output_base)

    def _start_worker(self, job: Job, *, name: str) -> threading.Thread:
        thread = threading.Thread(target=self._run_tracked, args=(job,), daemon=True, name=name)
        with self.lock:
            self.worker_threads.add(thread)
        thread.start()
        return thread

    def _run_tracked(self, job: Job) -> None:
        try:
            self._run(job)
        finally:
            with self.lock:
                self.worker_threads.discard(threading.current_thread())

    @staticmethod
    def _read_output'''
          if marker not in text and "def _start_worker(self, job: Job" not in text:
              raise SystemExit("JobManager worker helper insertion point not found")
          text = text.replace(marker, replacement, 1)

          old = '''    def shutdown(self) -> None:
        self.shutting_down.set()
        with self.lock:
            active = [job.id for job in self.jobs.values() if job.status not in TERMINAL_STATES]
        for job_id in active:
            self.stop(job_id)
'''
          new = '''    def shutdown(self) -> None:
        self.shutting_down.set()
        with self.lock:
            active = [job.id for job in self.jobs.values() if job.status not in TERMINAL_STATES]
        for job_id in active:
            self.stop(job_id)

        deadline = time.monotonic() + 15.0
        current = threading.current_thread()
        while time.monotonic() < deadline:
            with self.lock:
                workers = [thread for thread in self.worker_threads if thread is not current and thread.is_alive()]
            if not workers:
                break
            for thread in workers:
                remaining = max(0.0, deadline - time.monotonic())
                if remaining <= 0:
                    break
                thread.join(timeout=min(0.25, remaining))

        with self.lock:
            jobs = list(self.jobs.values())
        for job in jobs:
            self._persist(job, force=True)
'''
          if old not in text and new not in text:
              raise SystemExit("JobManager shutdown block not found")
          text = text.replace(old, new, 1)

          old = '        threading.Thread(target=self.manager._run, args=(job,), daemon=True, name=f"job-retry-{job.id}").start()'
          new = '        self.manager._start_worker(job, name=f"job-retry-{job.id}")'
          if old not in text and new not in text:
              raise SystemExit("Retry worker call not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Validate persistence and complete suite
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile server.py
          python -m pytest -q tests/test_shutdown_persistence.py tests/test_job_manager.py
          python -m pytest -q
      - name: Commit graceful shutdown fix
        run: |
          if git diff --quiet; then
            echo "Graceful shutdown fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git diff --cached --check
          git commit -m "fix: wait for durable job finalization during shutdown"
          git push origin HEAD:${{ github.head_ref }}

  install-build-upgrade:
    name: Install, build, upgrade, uninstall
    needs: fix-shutdown-persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development toolchain
        run: python -m pip install --upgrade pip -e '.[dev]'
      - name: Validate source
        run: make validate
      - name: Build and verify wheel/sdist
        run: make build
      - name: Exercise source install and in-place upgrade
        run: make lifecycle

  container-smoke:
    name: Build and start container
    needs: fix-shutdown-persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        env:
          PANEL_TOKEN: lifecycle-token
          GRAFANA_ADMIN_PASSWORD: lifecycle-password
        run: docker compose config --quiet
      - name: Build image
        run: |
          version="$(python3 -c 'from version import __version__; print(__version__)')"
          docker build --build-arg "APP_VERSION=${version}" -t "zeaz-ai-command-center:${version}" .
      - name: Start and health-check image
        run: |
          set -euo pipefail
          version="$(python3 -c 'from version import __version__; print(__version__)')"
          image="zeaz-ai-command-center:${version}"
          cid="$(docker run -d --rm \
            -e PANEL_TOKEN=lifecycle-token \
            -e PANEL_ALLOWED_HOSTS=localhost,127.0.0.1 \
            "$image")"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$cid" python3 -c 'import urllib.request; request=urllib.request.Request("http://127.0.0.1:8765/healthz", headers={"Authorization":"Bearer lifecycle-token"}); response=urllib.request.urlopen(request, timeout=2); assert response.status == 200'; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Container health check did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          label="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$cid")"
          [[ "$label" == "$version" ]]
