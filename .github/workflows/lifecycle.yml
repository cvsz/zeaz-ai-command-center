name: Release Lifecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-shutdown-persistence:
    name: Apply durable shutdown fix
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/lifecycle-validation-v3.4.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Track and join job workers
        run: python scripts/apply_shutdown_fix.py
      - name: Validate persistence and complete suite
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile server.py
          python -m pytest -q tests/test_shutdown_persistence.py tests/test_job_manager.py
          python -m pytest -q
      - name: Commit graceful shutdown fix
        run: |
          if git diff --quiet; then
            echo "Graceful shutdown fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git diff --cached --check
          git commit -m "fix: wait for durable job finalization during shutdown"
          git push origin HEAD:${{ github.head_ref }}

  install-build-upgrade:
    name: Install, build, upgrade, uninstall
    needs: fix-shutdown-persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development toolchain
        run: python -m pip install --upgrade pip -e '.[dev]'
      - name: Validate source
        run: make validate
      - name: Build and verify wheel/sdist
        run: make build
      - name: Exercise source install and in-place upgrade
        run: make lifecycle

  container-smoke:
    name: Build and start container
    needs: fix-shutdown-persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        env:
          PANEL_TOKEN: lifecycle-token
          GRAFANA_ADMIN_PASSWORD: lifecycle-password
        run: docker compose config --quiet
      - name: Build image
        run: |
          version="$(python3 -c 'from version import __version__; print(__version__)')"
          docker build --build-arg "APP_VERSION=${version}" -t "zeaz-ai-command-center:${version}" .
      - name: Start and health-check image
        run: |
          set -euo pipefail
          version="$(python3 -c 'from version import __version__; print(__version__)')"
          image="zeaz-ai-command-center:${version}"
          cid="$(docker run -d --rm \
            -e PANEL_TOKEN=lifecycle-token \
            -e PANEL_ALLOWED_HOSTS=localhost,127.0.0.1 \
            "$image")"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$cid" python3 -c 'import urllib.request; request=urllib.request.Request("http://127.0.0.1:8765/healthz", headers={"Authorization":"Bearer lifecycle-token"}); response=urllib.request.urlopen(request, timeout=2); assert response.status == 200'; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Container health check did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          label="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$cid")"
          [[ "$label" == "$version" ]]
