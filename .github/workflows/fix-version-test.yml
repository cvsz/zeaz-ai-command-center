name: Fix Release Version Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'chore/lifecycle-validation-v3.4.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Update stale version assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_http.py")
          text = path.read_text()
          import_line = "from storage import JobStore\n"
          if "from version import __version__" not in text:
              text = text.replace(import_line, import_line + "from version import __version__\n", 1)
          old = 'assert json.loads(payload)["version"] == "3.3.0"'
          new = 'assert json.loads(payload)["version"] == __version__'
          if old not in text and new not in text:
              raise SystemExit("Expected version assertion was not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate complete suite
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_http.py
          git diff --cached --check
          git commit -m "test: derive HTTP version expectation from release source"
          git push origin HEAD:${{ github.head_ref }}
