name: Bootstrap GitHub Environments

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-environments.yml
      - docs/GITHUB-ENVIRONMENTS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create ${{ matrix.environment }} environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    steps:
      - name: Confirm environment
        run: echo "GitHub environment '${{ matrix.environment }}' is available."
