name: Internal Clean Executable Policy Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply_clean_exec_patch.py

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/trusted-provider-executable-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply reviewed policy patch
        run: python scripts/apply_clean_exec_patch.py
      - name: Validate patch
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile server.py
          python -m pytest tests/test_executable_policy.py
      - name: Commit production files
        run: |
          rm scripts/apply_clean_exec_patch.py
          rmdir scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.py tests/test_executable_policy.py scripts/apply_clean_exec_patch.py
          git commit -m 'fix: trust PATH-resolved provider executables'
          git push origin HEAD:${{ github.head_ref }}
