name: Internal Provider Test Patch

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - scripts/patch_provider_test.py

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/trusted-provider-executable-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch provider test fixture
        run: python scripts/patch_provider_test.py
      - name: Validate complete test suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest
      - name: Commit test compatibility update
        run: |
          rm scripts/patch_provider_test.py
          rmdir scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_server.py scripts/patch_provider_test.py
          git commit -m 'test: configure trusted root for custom provider probe'
          git push origin HEAD:${{ github.head_ref }}
