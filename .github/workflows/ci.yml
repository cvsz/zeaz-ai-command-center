name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Python lint
        run: ruff check --select E9,F63,F7,F82 server.py help_parser.py storage.py tests
      - name: Python compile
        run: python -m py_compile server.py help_parser.py storage.py
      - name: Unit and integration tests
        run: python -m pytest

  frontend-and-shell:
    name: Frontend and shell validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Bash syntax
        run: bash -n install.sh start.sh uninstall.sh
      - name: Reject generated files
        run: |
          ! find . -path ./.git -prune -o \( -name __pycache__ -o -name .pytest_cache -o -name '*.pyc' -o -name '*.sqlite3' \) -print | grep .

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build rootless image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: zeaz-ai-command-center:ci
