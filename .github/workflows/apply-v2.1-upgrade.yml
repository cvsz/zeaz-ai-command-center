name: Apply v2.1 Upgrade

on:
  push:
    branches:
      - upgrade/v2.1-production-foundation
    paths:
      - .upgrade/READY
  pull_request:
    branches:
      - main
    paths:
      - .upgrade/READY
      - .github/workflows/apply-v2.1-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v2.1-production-foundation
          fetch-depth: 0
      - name: Verify upgrade marker
        run: test -f .upgrade/READY
      - name: Reconstruct source archive
        run: |
          cat .upgrade/source.tar.gz.b64.part-* | base64 --decode > /tmp/zeaz-ai-command-center-v2.1.tar.gz
          echo "da0e372e288cf1b99c90030af3089d729f8ae13a1123d1c524ca44960dd01035  /tmp/zeaz-ai-command-center-v2.1.tar.gz" | sha256sum --check
          tar -tzf /tmp/zeaz-ai-command-center-v2.1.tar.gz >/dev/null
      - name: Apply source tree
        run: |
          tar -xzf /tmp/zeaz-ai-command-center-v2.1.tar.gz
          rm -rf .upgrade
          rm -f .github/workflows/apply-v2.1-upgrade.yml
      - name: Validate source
        run: |
          python3 -m py_compile server.py help_parser.py storage.py
          python3 -m pip install --disable-pip-version-check -q pytest
          python3 -m pytest -q
          node --check static/app.js
          bash -n install.sh start.sh uninstall.sh
      - name: Commit production foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: upgrade AI Command Center to v2.1 production foundation"
          git push origin HEAD:upgrade/v2.1-production-foundation
