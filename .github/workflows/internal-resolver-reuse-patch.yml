name: Internal Resolver Reuse Patch

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - scripts/reuse_executable_resolver.py

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/trusted-provider-executable-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reuse validated executable resolver
        run: python scripts/reuse_executable_resolver.py
      - name: Validate complete suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile server.py
          python -m pytest
      - name: Commit production patch
        run: |
          rm scripts/reuse_executable_resolver.py
          rmdir scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.py scripts/reuse_executable_resolver.py
          git commit -m 'security: reuse validated executable resolver'
          git push origin HEAD:${{ github.head_ref }}
